<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Shop | Laptop & Phone Accessories</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Arial, Helvetica, sans-serif, sans-serif;
      }
      body {
        background-color: #f1f1f1;
        padding-bottom: 80px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .topbar {
        background-color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      }
      .menu {
        font-size: 26px;
        cursor: pointer;
      }
      .logo {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1px;
        flex: 1;
      }
      .logo span {
        color: #f68b1e;
      }
      .icons {
        font-size: 24px;
        display: flex;
        gap: 14px;
        cursor: pointer;
        position: relative;
      }
      #cartcount {
        position: absolute;
        top: -8px;
        right: -6px;
        background-color: #f68b1e;
        color: #f68b1e;
        font-size: 11px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .search-wrap {
        background: #f1f1f1;
        padding: 0 14px 12px;
      }
      .search {
        background: #f1f1f1;
        border-radius: 25px;
        padding: 12px 14px;
        display: flex;
        gap: 8px;
        color: #666;
        font-size: 14px;
      }
      .hero {
        margin: 12px 14px;
        border-radius: 14px;
        overflow: hidden;
        background: #1a0a2e;
        color: #fff;
        display: flex;
        min-height: 180px;
        position: relative;
      }
      .hero-text {
        padding: 18px;
        flex: 1.2;
        z-index: 2;
      }
      .hero-text small {
        opacity: 0.8;
      }
      .hero-text h2 {
        font-size: 28px;
        line-height: 1.1;
        margin: 4px 0;
      }
      .hero-text span {
        color: #ffcc00;
      }
      .hero-text p {
        font-weight: 700;
        margin-top: 8px;
      }
      .hero button {
        margin-top: 14px;
        background: #fff;
        border: none;
        padding: 9px 16px;
        border-radius: 20px;
        font-weight: 700;
        cursor: pointer;
      }
      .hero img {
        width: 45%;
        object-fit: cover;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 8px 0;
      }
      .dots span {
        width: 8px;
        height: 8px;
        background: #bbb;
        border-radius: 20px;
      }
      .dots span.active {
        width: 24px;
        background: #333;
      }
      .promo-row {
        display: flex;
        gap: 12px;
        padding: 0 14px;
      }
      .promo {
        flex: 1;
        border-radius: 12px;
        overflow: hidden;
        background: #333;
        color: #fff;
        min-height: 160px;
        padding: 14px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .promo.light {
        background: #fff;
        color: #111;
        border: 1px solid #ddd;
      }
      .promo h3 {
        font-size: 18px;
        line-height: 1.2;
      }
      .promo .big {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
      }
      .promo .tag {
        background: #fff;
        color: #000;
        font-size: 11px;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 20px;
        text-align: center;
        margin-top: 10px;
      }
      .promo.light .tag {
        background: #111;
        color: #fff;
      }
      .flash {
        background: #e4002b;
        margin: 16px 14px 0;
        border-radius: 14px 14px 0 0;
        color: #fff;
        padding: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .flash h2 {
        font-size: 22px;
      }
      .timer {
        background: #fff;
        color: #111;
        padding: 5px 10px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 13px;
      }
      .flash-arrow {
        background: #fff;
        color: #e4002b;
        width: 38px;
        height: 38px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .products {
        background: #fff;
        margin: 0 14px;
        border-radius: 0 0 14px 14px;
        padding: 12px;
        display: flex;
        gap: 12px;
        overflow-x: auto;
      }
      .card {
        min-width: 150px;
        border: 1px solid #eee;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .card img {
        width: 100%;
        height: 110px;
        object-fit: cover;
      }
      .card-body {
        padding: 8px;
        position: relative;
      }
      .card-body h4 {
        font-size: 13px;
        height: 32px;
        overflow: hidden;
      }
      .price {
        color: #f68b1e;
        font-weight: 900;
        margin-top: 6px;
      }
      .old {
        color: #999;
        text-decoration: line-through;
        font-size: 12px;
        font-weight: 400;
      }
      .stock {
        color: #b8860b;
        font-size: 11px;
        font-weight: 700;
        margin-top: 4px;
      }
      .add-btn {
        position: absolute;
        top: -18px;
        right: 8px;
        background: #111;
        color: #fff;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        font-size: 20px;
        cursor: pointer;
      }
      .section {
        padding: 16px 14px 0;
      }
      .section h2 {
        font-size: 18px;
        margin-bottom: 10px;
      }
      .cats {
        display: flex;
        gap: 10px;
        overflow-x: auto;
      }
      .cat {
        min-width: 80px;
        background: #fff;
        border-radius: 12px;
        padding: 12px 6px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid #eee;
      }
      .cat span {
        font-size: 26px;
        display: block;
        margin-bottom: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px 14px;
      }
      .grid .card {
        min-width: auto;
      }
      .grid .card img {
        height: 130px;
      }
      footer {
        background: #111;
        color: #fff;
        padding: 20px 14px;
        margin-top: 20px;
        text-align: center;
      }
      footer p {
        font-size: 13px;
        opacity: 0.8;
        margin-top: 8px;
        line-height: 1.5;
      }
      footer button {
        background: #f68b1e;
        border: none;
        color: #fff;
        padding: 10px 18px;
        border-radius: 20px;
        font-weight: 700;
        margin-top: 12px;
        cursor: pointer;
      }
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
        border-top: 1px solid #ddd;
        font-size: 12px;
        text-align: center;
        z-index: 100;
      }
      .bottom-nav div {
        cursor: pointer;
      }
      .bottom-nav span {
        display: block;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>My Shop</h1>
      <nav>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <img src="images/hero.jpg" alt="Laptop and phone accessories" />
      <div class="hero-text">
        <h2>Quality Laptop & Phone Accessories</h2>
        <a href="#products" class="btn">Shop Now</a>
      </div>
    </section>

    <section id="products">
      <h2>Our Products</h2>
      <div id="product-list" class="grid"></div>
    </section>

    <section id="about">
      <h2>About Us</h2>
      <p>Write a short description of your business here.</p>
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <input type="text" name="name" placeholder="Your name" required />
        <input type="email" name="email" placeholder="Your email" required />
        <textarea name="message" placeholder="Message" required></textarea>
        <button type="submit" class="btn">Send</button>
      </form>
    </section>

    <footer><p>&copy; 2026 My Shop</p></footer>
    <script src="js/main.js"></script>
  </body>
</html>
